# ---------------------------------------------------------------------------
# phpboyscout/iac/terraform-aws-gitlab-runner-fleet CI pipeline.
#
# Single-module repo (module HCL at root + examples/minimal fixture).
# Imports the reusable phpboyscout/cicd components. colophon
# maintains a Release MR on `main`; merging it cuts a vX.Y.Z tag whose
# pipeline runs tofu-module-publish, pushing the module to the GitLab
# module registry under gitlab.com/phpboyscout/gitlab-runner-fleet/aws.
#
# Required CI variable:
#   COLOPHON_TOKEN — project access token (Maintainer; api,
#   read_repository, write_repository) for the release-MR + tag.
# ---------------------------------------------------------------------------

stages:
  - lint
  - security
  - test
  - pages
  - release
  - .post

include:
  - component: gitlab.com/phpboyscout/cicd/colophon@main
    inputs:
      branch: main
      stage: release

  - component: gitlab.com/phpboyscout/cicd/tofu-lint@main
    inputs:
      stage: lint
      paths: ". examples/minimal"

  - component: gitlab.com/phpboyscout/cicd/tofu-security@main
    inputs:
      stage: security
      paths: "."

  - component: gitlab.com/phpboyscout/cicd/tofu-validate@main
    inputs:
      stage: test
      validate_paths: ". examples/minimal"

  - component: gitlab.com/phpboyscout/cicd/tofu-module-publish@main
    inputs:
      stage: release
      module_name: gitlab-runner-fleet

  - component: gitlab.com/phpboyscout/cicd/zensical-pages@main
    inputs:
      stage: pages
