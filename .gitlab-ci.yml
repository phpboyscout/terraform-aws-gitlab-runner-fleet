# ---------------------------------------------------------------------------
# phpboyscout/iac/terraform-aws-gitlab-runner-fleet CI pipeline.
#
# Single-module repo (module HCL at root + examples/minimal fixture).
# Imports the reusable phpboyscout/cicd components. releaser-pleaser
# maintains a Release MR on `main`; merging it cuts a vX.Y.Z tag whose
# pipeline runs tofu-module-publish, pushing the module to the GitLab
# module registry under gitlab.com/phpboyscout/gitlab-runner-fleet/aws.
#
# Required CI variable:
#   RELEASER_PLEASER_TOKEN — project access token (Maintainer; api,
#   read_repository, write_repository) for the release-MR + tag.
# ---------------------------------------------------------------------------

stages:
  - lint
  - security
  - test
  - release
  - .post

include:
  - component: gitlab.com/phpboyscout/cicd/releaser-pleaser@v0.33.0
    inputs:
      branch: main
      stage: release
      token: $RELEASER_PLEASER_TOKEN

  - component: gitlab.com/phpboyscout/cicd/tofu-lint@v0.33.0
    inputs:
      stage: lint
      paths: ". examples/minimal"

  - component: gitlab.com/phpboyscout/cicd/tofu-security@v0.33.0
    inputs:
      stage: security
      paths: "."

  - component: gitlab.com/phpboyscout/cicd/tofu-validate@v0.33.0
    inputs:
      stage: test
      validate_paths: ". examples/minimal"

  - component: gitlab.com/phpboyscout/cicd/tofu-module-publish@v0.33.0
    inputs:
      module_name: gitlab-runner-fleet
